<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello WebXR!</title>

  <!-- three.js -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #xr-button {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 16px;
      z-index: 10;
    }
  </style>
</head>
<body>

<button id="xr-button" onclick="activateXR()">Start Hello WebXR</button>

<script>
async function activateXR() {
  // 1. Validar si el navegador y dispositivo soportan WebXR e immersive-ar
  if (!navigator.xr) {
    alert("WebXR no está disponible en este navegador.");
    return;
  }

  const isSupported = await navigator.xr.isSessionSupported("immersive-ar");
  if (!isSupported) {
    alert("El modo 'immersive-ar' no es compatible con este dispositivo.");
    return;
  }

  // Ocultar botón de inicio
  document.getElementById("xr-button").style.display = "none";

  // 2. Crear canvas y contexto WebGL compatible con WebXR
  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  const gl = canvas.getContext("webgl", { xrCompatible: true });

  const scene = new THREE.Scene();

  const materials = [
    new THREE.MeshBasicMaterial({ color: 0xff0000 }),
    new THREE.MeshBasicMaterial({ color: 0x0000ff }),
    new THREE.MeshBasicMaterial({ color: 0x00ff00 }),
    new THREE.MeshBasicMaterial({ color: 0xff00ff }),
    new THREE.MeshBasicMaterial({ color: 0x00ffff }),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  ];

  // 3. Crear el cubo y ubicarlo frente al usuario (0.5 metros adelante)
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), materials);
  cube.position.set(0, 0, -0.5);
  scene.add(cube);

  // 4. Configurar el renderer
  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    preserveDrawingBuffer: true,
    canvas: canvas,
    context: gl
  });
  renderer.autoClear = false;

  const camera = new THREE.PerspectiveCamera();
  camera.matrixAutoUpdate = false;

  // 5. Iniciar la sesión WebXR
  const session = await navigator.xr.requestSession("immersive-ar");
  session.updateRenderState({
    baseLayer: new XRWebGLLayer(session, gl)
  });

  const referenceSpace = await session.requestReferenceSpace('local');

  // 6. Bucle de renderizado
  const onXRFrame = (time, frame) => {
    session.requestAnimationFrame(onXRFrame);

    const baseLayer = session.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, baseLayer.framebuffer);

    const pose = frame.getViewerPose(referenceSpace);
    if (pose) {
      // Soporta tanto móvil (1 vista) como visores/gafas (2 vistas)
      for (const view of pose.views) {
        const viewport = baseLayer.getViewport(view);
        
        // Asignación correcta de viewport sin redimensionar el canvas por frame
        renderer.setViewport(viewport.x, viewport.y, viewport.width, viewport.height);

        camera.matrix.fromArray(view.transform.matrix);
        camera.projectionMatrix.fromArray(view.projectionMatrix);
        camera.updateMatrixWorld(true);

        renderer.render(scene, camera);
      }
    }
  };

  session.requestAnimationFrame(onXRFrame);
}
</script>
</body>
</html>
