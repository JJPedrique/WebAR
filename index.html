<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoAR.js - Experiencia Basada en Ubicación</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <!-- AR.js para A-Frame (Soporte de GeoAR) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Cámara de AR con brújula y seguimiento GPS habilitado -->
    <a-camera gps-camera rotation-reader></a-camera>

    <!-- Elemento 3D anclado a Coordenadas GPS -->
    <!-- REEMPLAZA latitude y longitude con tus coordenadas reales -->
    <a-box
      material="color: #4CC3D9; opacity: 0.8;"
      scale="10 10 10"
      gps-entity-place="latitude: 10.6427; longitude: -71.6125;"
    >
      <a-text
        value="¡Objeto en GeoAR!"
        align="center"
        position="0 1.5 0"
        scale="2 2 2"
        color="#FFFFFF"
      ></a-text>
    </a-box>
  </a-scene>

<script>
  window.onload = () => {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        // Crear una nueva entidad A-Frame de forma dinámica
        const scene = document.querySelector('a-scene');
        const entity = document.createElement('a-box');
        
        entity.setAttribute('material', 'color: #E74C3C');
        entity.setAttribute('scale', '5 5 5');
        // Coloca el objeto ligeramente desplazado para que sea visible cerca
        entity.setAttribute('gps-entity-place', `latitude: ${latitude + 0.0001}; longitude: ${longitude + 0.0001};`);

        scene.appendChild(entity);
      },
      (err) => console.error('Error al obtener la geolocalización:', err),
      { enableHighAccuracy: true }
    );
  };
</script>
</body>
</html>
