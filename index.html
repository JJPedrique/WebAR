<!DOCTYPE html>
<head>
    <title>AR.js A-Frame Location-based</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
    <script src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script>
        THREEx.ArToolkitContext.baseURL = 'https://raw.githack.com/jeromeetienne/ar.js/master/three.js/'
    </script>

</head>
<body>
    <a-scene id="SandBox" vr-mode-ui='enabled: false' arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false' renderer='antialias: true; alpha: true'>
        
        <a-camera gps-new-camera></a-camera>
        
        <a-entity material='color: blue'
            geometry='primitive: box' 
            gps-new-entity-place="latitude: 10.664075; 
            longitude: -71.66499" 
            scale="1 1 1">
        </a-entity>

    </a-scene>

    <script src="assets/js/geolocalizador.js"></script>
</body>
</html>
