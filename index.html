<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>WebAR - Demo</title>
    <link rel="shortcut icon" href="assets/img/icon.svg" type="image/x-icon">
    <!--AR.JS-->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--Trees.js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar.js"></script>

   <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <header class="fixed-top">
      <nav class="navbar bg-primary">
        <div class="container-fluid d-flex">
          <a class="navbar-brand fs-6 text-white fw-bold flex-grow-1" href="index.html"><i class="bi bi-phone-flip fs-6"></i> WebAR - Super Mario 64</a>
          <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom" aria-controls="offcanvasBottom"><i class="bi bi-globe-americas"></i></button>
        </div>
      </nav>
    </header>

    <main>
      <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
      
      <a-camera gps-camera rotation-reader></a-camera>

      </a-scene>
    </main>

    <footer class="fixed-bottom">
      <div class="card mb-3 mx-3">
        <div class="row g-0 align-items-center">
          <div class="col-auto p-2" style="width: 60px;">
            <img src="assets/img/SM64_Mario_Head.webp" class="img-fluid rounded-start" alt="Mario 64">
          </div>
          <div class="col">
            <div class="card-body py-2 px-3">
              <h5 class="card-title mb-1">Find Mario</h5>
              <p class="card-text mb-0">
                <small class="text-body-secondary">It might appear somewhere...</small>
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasBottomLabel">Your Location</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body small">
        <p id="latitude">Latitude: ERROR</p>
        <p id="longitude">Logitude: ERROR</p>
        <hr>
        <p><i class="bi bi-phone-flip fs-6"></i> WebAR &copy; - Todos los Derechos Reservados - Elaborado por <a href="https://github.com/JJPedrique">@JJPedrique</a></p>
      </div>
    </div>

    <!--Boostrap-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <!--Mario-->
    <script src="assets/js/script.js"></script>
  </body>
</html>
